/*
=========== SETUP ===========
1) Firebase Console: Firestore + Authentication (Email/Password) enable koro. Auth > Users e nijer admin email/password banao.
2) Cloudinary: free account, Settings > Upload > Unsigned upload preset banao. CLOUD_NAME ar PRESET niche boshao.
   (Note: baki chobi Firestore theke muche jay, kintu Cloudinary te file thake. Free plan e jothesto jayga ache, chaile Cloudinary Media Library theke mane mane clear koro.)
3) Firestore Rules (deadline server e enforce hoy, browser bypass kore lav nai):

rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {

    // Dhaka time (UTC+6). Shonibar=0, Robibar=1 ... Brihospotibar=5, Shukrobar=6
    function dhakaDow() { return (math.floor((request.time.toMillis() + 21600000) / 86400000) - 2) % 7; }
    function hasCfg()   { return exists(/databases/$(db)/documents/config/week); }
    function cfg()      { return get(/databases/$(db)/documents/config/week).data; }
    function inCfg()    { return hasCfg() && 'startAt' in cfg() && cfg().startAt <= request.time && request.time < cfg().endAt; }
    // admin panel theke date set kora thakle oita, na hole auto: Shonibar-Brihospotibar khola, Shukrobar bondho
    function isOpen()   { return inCfg()
                            ? (request.time < cfg().closeAt && request.resource.data.weekId == cfg().start)
                            : dhakaDow() != 6; }

    match /config/{d} {
      allow read: if true;
      allow write: if request.auth != null;
    }
    match /submissions/{id} {
      allow create: if isOpen()
        && request.resource.data.winner == false
        && request.resource.data.keys().hasOnly(['weekId','name','roll','group','section','caption','url','winner','createdAt'])
        && request.resource.data.name is string && request.resource.data.name.size() < 60
        && request.resource.data.roll is string && request.resource.data.roll.size() < 15
        && request.resource.data.group in ['science','business','humanities']
        && request.resource.data.section is string && request.resource.data.section.size() < 3
        && id == request.resource.data.weekId + '_' + request.resource.data.roll;
      allow read, update, delete: if request.auth != null;
    }
    match /winners/{id} {
      allow read, write: if request.auth != null;
    }
  }
}
4) Admin panel: yoursite.com/#/admin
=============================
*/
:root{--p:#6b3fa0;--p2:#8b5cc7;--bg:#f4effb;--red:#d62828;--ink:#1d1030;--gold:#f5b800}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;background:linear-gradient(180deg,#fff,var(--bg) 40%,#c9b0ea);min-height:100vh;color:var(--ink);background-attachment:fixed;overflow-x:hidden}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaters span{position:absolute;bottom:-60px;font-size:26px;opacity:.18;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;position:relative;z-index:1}
.logos{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logos img{height:64px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 4px #0002)}
.logos .lg-l{height:72px;mix-blend-mode:multiply}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:8px}
.top b{font-size:14px;color:var(--p)}
h1{text-align:center;font-size:34px;color:var(--p);line-height:1.2}
.ribbon{display:block;width:fit-content;margin:8px auto;background:var(--red);color:#fff;padding:2px 22px;border-radius:6px;font-size:26px;font-weight:700;transform:rotate(-2deg);box-shadow:0 6px 14px #d6282855;animation:wob 3s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(2deg) scale(1.04)}}
.sub{text-align:center;font-size:24px;font-weight:700;color:var(--p);margin-bottom:6px}
.range{text-align:center;font-weight:600;margin:10px 0 14px;color:#4a3270}
.theme{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;border-radius:16px;padding:12px 16px;text-align:center;margin-bottom:16px;font-weight:600;box-shadow:0 8px 20px #6b3fa044}
.theme b{display:block;font-size:22px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.timer div{background:#fff;border-radius:14px;text-align:center;padding:10px 0;box-shadow:0 6px 16px #6b3fa022}
.timer b{display:block;font-size:28px;color:var(--p);font-variant-numeric:tabular-nums}
.timer small{font-size:12px;color:#7a6a92}
.film{background:#150c20;border-radius:14px;position:relative;margin-bottom:10px;box-shadow:0 10px 26px #150c2088}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 8px,#ffffffcc 8px 16px,transparent 16px 24px);opacity:.55;z-index:2;pointer-events:none}
.film::before{top:5px}.film::after{bottom:5px}
.reel{display:flex;gap:10px;overflow-x:auto;padding:24px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.fr{flex:0 0 86px;height:118px;background:#2d2140;border-radius:8px;color:#fff;text-align:center;padding-top:12px;cursor:pointer;scroll-snap-align:center;transition:.3s;border:2px solid #4a3a63;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.fr i{display:block;font-style:normal;font-size:30px;margin-bottom:2px}
.fr b{display:block;font-size:15px}.fr small{display:block;font-size:20px;font-weight:700}
.fr:hover{transform:translateY(-6px) rotate(-2deg)}
.fr.past{opacity:.45;filter:grayscale(1)}
.fr.now{border-color:var(--gold);background:linear-gradient(160deg,#6b3fa0,#8b5cc7);transform:scale(1.08);box-shadow:0 0 20px var(--gold);animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 34px var(--gold)}}
.fr.sel{outline:3px solid #fff;outline-offset:2px}
.fr.mark::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.fi{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:18px;font-weight:600;text-align:center;min-height:50px;box-shadow:0 6px 16px #6b3fa022;transition:.2s}
.poster{background:linear-gradient(160deg,#fff 0,#e5d6f7 100%);border:2px solid var(--p2);border-radius:22px;padding:18px;text-align:center;margin-bottom:18px;box-shadow:0 10px 30px #6b3fa033;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.poster .l{font-size:24px;font-weight:700}
.poster .n{font-size:110px;line-height:1;font-weight:700;color:var(--p)}
.poster .n small{font-size:34px;color:var(--ink);margin-left:6px;border:3px solid var(--red);border-radius:50%;padding:2px 16px;display:inline-block;transform:rotate(-4deg)}
.poster.hot{border-color:var(--red)}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 26px #6b3fa022;margin-bottom:18px}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:14px}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid #d9c9ef;border-radius:12px;font:inherit;background:#fcfaff}
input:focus,textarea:focus{outline:2px solid var(--p2)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--p);color:#fff;transition:.15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.5}
.full{width:100%;margin-top:18px;font-size:17px}
.drop{border:2px dashed var(--p2);border-radius:14px;padding:18px;text-align:center;color:var(--p);cursor:pointer;background:#faf6ff}
.drop:hover{background:#f1e7ff}
.drop img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:auto}
.msg{margin-top:12px;padding:12px;border-radius:12px;font-weight:600;text-align:center;display:none}
.msg.ok{display:block;background:#e3f8e7;color:#17692b}.msg.err{display:block;background:#fde4e4;color:#a11}
.closed{text-align:center;font-weight:700;color:var(--red);padding:14px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#flash.go{animation:fl .6s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

/* group / section chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#f1e7ff;color:var(--p);border:2px solid transparent;padding:9px 15px;border-radius:999px;font-size:15px}
.chip:hover{border-color:var(--p2)}
.chip.on{background:var(--p);color:#fff;transform:scale(1.07);box-shadow:0 6px 14px #6b3fa055}
.chip[data-g=science].on{background:#1677c9}
.chip[data-g=business].on{background:#d98a00}
.chip[data-g=humanities].on{background:#1f9d55}
.chip.sc{min-width:46px;text-align:center;animation:chipin .4s both}
@keyframes chipin{from{opacity:0;transform:translateY(14px) scale(.5)}}
#secWrap{animation:chipin .35s both}
.bd{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:2px 9px;border-radius:999px;vertical-align:middle}
.bd.science{background:#1677c9}.bd.business{background:#d98a00}.bd.humanities{background:#1f9d55}

/* winner reveal */
.stage-card{background:linear-gradient(160deg,#2a1450,#6b3fa0);color:#fff;border-radius:24px;padding:22px 16px;margin-bottom:18px;text-align:center;box-shadow:0 14px 40px #2a145099;position:relative;overflow:hidden}
.stage-card h2{font-size:26px;margin-bottom:4px}
.stage-card p{opacity:.8;font-size:14px;margin-bottom:14px}
.slots{display:flex;flex-direction:column;gap:12px}
.slot{perspective:900px;height:150px;cursor:pointer}
.slot .in{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.slot.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px}
.front{background:repeating-linear-gradient(45deg,#3d2072,#3d2072 10px,#4a2a86 10px,#4a2a86 20px);border:2px dashed #ffffff66;font-size:26px;font-weight:700;flex-direction:column}
.front .q{font-size:46px;animation:wob 1.6s infinite}
.back{transform:rotateY(180deg);background:#fff;color:var(--ink);text-align:left;justify-content:flex-start}
.back img{width:128px;height:128px;object-fit:cover;border-radius:14px;cursor:zoom-in;flex-shrink:0}
.back .t b{font-size:20px;display:block}.back .t span{font-size:13px;color:#6a5a82}
.back .rk{font-size:34px}
.slot.r1 .back{background:linear-gradient(135deg,#fff7d1,#ffe07a);box-shadow:0 0 30px var(--gold)}
.slot.r1{height:170px}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:700;background:#2a1450ee;z-index:5;border-radius:18px;animation:pop .5s}
@keyframes pop{from{transform:scale(2);opacity:0}}
.gold{background:var(--gold);color:#2a1450}

/* admin */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sub-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px #0002}
.sub-card img{width:100%;height:200px;object-fit:cover;cursor:zoom-in}
.sub-card>div{padding:10px 12px;font-size:14px}
.sub-card.w{outline:3px solid var(--gold)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.row button{flex:1;padding:8px;font-size:13px;min-width:44px}
.del{background:var(--red)}
.scorebox{display:flex;align-items:center;gap:8px;margin-top:8px}
.scorebox input{padding:8px 10px;font-weight:700;font-size:18px;text-align:center;width:90px}
.scorebox span{font-size:12px;color:#7a6a92}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lb{display:flex;gap:12px;align-items:center;background:#faf6ff;border-radius:14px;padding:10px 12px;margin-top:10px}
.lb.first{background:linear-gradient(135deg,#fff7d1,#ffe07a);box-shadow:0 0 18px #f5b80088}
.lb .rn{font-size:26px;font-weight:700;min-width:34px;text-align:center}
.lb .ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lb .ph img{width:48px;height:48px;border-radius:8px;object-fit:cover;cursor:zoom-in}
.lb .pt{margin-left:auto;font-size:22px;font-weight:700;color:var(--p);text-align:center}
.lb .pt small{display:block;font-size:11px;color:#7a6a92}
.wide{max-width:1100px}
.hidden{display:none}
/* ================= OFFICIAL DCPC BRAND THEME ================= */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(107,63,160,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(107,63,160,.075) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(180deg,#000 35%,transparent 95%);mask-image:linear-gradient(180deg,#000 35%,transparent 95%)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#a67cff;top:-25vmax;left:-20vmax}
.aurora i:nth-child(2){background:#ff8fb3;bottom:-30vmax;right:-25vmax;animation-delay:-8s;opacity:.2}
.aurora i:nth-child(3){background:#7cc4ff;top:40vh;left:35vw;width:35vmax;height:35vmax;animation-delay:-14s;opacity:.15}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#glow{position:fixed;top:0;left:0;width:500px;height:500px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,#8b5cc733,transparent 65%);transition:transform .12s linear}
@media (hover:none){#glow{display:none}}
.floaters span{opacity:.12}

#pre{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s,visibility .8s}
#pre.out{opacity:0;visibility:hidden}
.pre-t{font-weight:700;letter-spacing:12px;font-size:20px;color:var(--p);animation:fade 1.2s infinite alternate}
@keyframes fade{from{opacity:.3}}

.iris{width:104px;height:104px;margin:0 auto 4px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,#6b3fa0,#d62828,#f5b800,#8b5cc7,#6b3fa0);animation:spin 9s linear infinite;box-shadow:0 12px 40px #6b3fa055}
.iris::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.iris::after{content:"";position:absolute;inset:33px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#a67cff 35%,#2a1450 80%);animation:breathe 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.8)}}
.iris.big{width:140px;height:140px}

.logos img{background:#fff;border-radius:14px;padding:6px;height:56px;box-shadow:0 8px 22px #6b3fa033}
.logos .lg-l{height:56px;mix-blend-mode:normal}
.hero{text-align:center;margin:4px 0 20px}
.kick{font-size:12px;letter-spacing:6px;color:var(--p2);font-weight:600;margin:8px 0 6px}
h1{font-size:clamp(36px,11vw,58px);line-height:1.15}
.card{border:1px solid rgba(107,63,160,.12);background-image:radial-gradient(420px circle at var(--cx,50%) var(--cy,0%),rgba(139,92,200,.12),transparent 60%)}
.full{position:relative;overflow:hidden;background:linear-gradient(135deg,#6b3fa0,#8b5cc7);box-shadow:0 10px 26px #6b3fa055}
.full::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff6,transparent);transform:skewX(-20deg);animation:sweep 3.2s infinite}
@keyframes sweep{to{left:140%}}
.gold{background:var(--gold);color:#2a1450}
.tilt{transition:transform .25s ease-out;will-change:transform}
.rv{opacity:0}
.rv.in{opacity:1;animation:up .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(34px) scale(.97)}}

/* countdown: camera viewfinder */
.vf{position:relative;background:linear-gradient(160deg,#20123a,#4a2a86);border-radius:22px;padding:18px 20px 16px;color:#fff;margin-bottom:18px;box-shadow:0 16px 40px #2a145088;overflow:hidden}
.vf::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,#ffffff1c 33.2% 33.8%,transparent 33.8% 66.2%,#ffffff1c 66.2% 66.8%,transparent 66.8%),linear-gradient(0deg,transparent 33.2%,#ffffff1c 33.2% 33.8%,transparent 33.8% 66.2%,#ffffff1c 66.2% 66.8%,transparent 66.8%)}
.vf .c{position:absolute;width:24px;height:24px;border:0 solid #fff}
.vf .tl{top:10px;left:10px;border-top-width:3px;border-left-width:3px}
.vf .tr{top:10px;right:10px;border-top-width:3px;border-right-width:3px}
.vf .bl{bottom:10px;left:10px;border-bottom-width:3px;border-left-width:3px}
.vf .br{bottom:10px;right:10px;border-bottom-width:3px;border-right-width:3px}
.vf-top{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px;padding:0 8px;position:relative}
.rec{color:#ff5470;font-weight:700;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.vf-mid{display:flex;justify-content:center;padding:14px 0 6px;position:relative}
.vf-num{display:flex;flex-direction:column;align-items:center;gap:10px}
.vf-num b{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:80px;line-height:1;border:3px solid #ffc83d;box-shadow:0 0 0 9px #ffffff12,0 0 44px #ffc83d66;animation:focus 2s ease-in-out infinite}
.vf-num span{font-weight:700;font-size:18px}
@keyframes focus{50%{transform:scale(1.06)}}
.vf.hot .vf-num b{border-color:#ff5470;box-shadow:0 0 0 9px #ff547024,0 0 44px #ff547099}
.vf-today{font-size:40px;font-weight:700;text-align:center;line-height:1.2;color:#ffc83d;animation:focus 1.4s ease-in-out infinite}
.vf-bar{display:flex;justify-content:space-between;max-width:260px;margin:8px auto 0;position:relative}
.vf-bar em{font-style:normal;font-size:12px;opacity:.5;text-align:center;width:44px}
.vf-bar u{display:block;width:2px;height:12px;background:#fff;margin:0 auto 4px}
.vf-bar .on{opacity:1;color:#ffc83d;font-weight:700}
.vf-bar .on u{height:22px;background:#ffc83d}
.vf-cap{text-align:center;font-weight:700;margin-top:10px;position:relative}

/* social */
.social{text-align:center;margin-top:6px}
.social>span{font-weight:700;color:var(--p);letter-spacing:1px}
.sl{display:flex;gap:12px;justify-content:center;margin:12px 0}
.sl a{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:16px;color:#fff;text-decoration:none;font-weight:700;transition:.25s;box-shadow:0 8px 22px #0002}
.sl a:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 14px 30px #0003}
.sl svg{width:24px;height:24px}
.sl .fb{background:#1877f2}
.sl .ig{background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.social small{color:#7a6a92}

/* roll hint */
.hint{display:none;margin-top:10px;padding:10px 14px;border-radius:12px;background:#f1e7ff;color:var(--p);font-weight:600;font-size:14px;text-align:center}
.hint.show{display:block;animation:chipin .35s both}
/* ===== animated camera + autofocus countdown ===== */
.cam{width:200px;max-width:60vw;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 16px 22px #6b3fa055);animation:camfloat 4s ease-in-out infinite}
@keyframes camfloat{50%{transform:translateY(-8px) rotate(-1.5deg)}}
.cam .ap{transform-origin:110px 100px;animation:apt 5s ease-in-out infinite}
@keyframes apt{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(60deg) scale(.5)}}
.cam .fl{animation:flb 4s infinite}
@keyframes flb{0%,84%,100%{opacity:.35}88%{opacity:1}}
.cam .btn{animation:press 4s infinite}
@keyframes press{0%,82%,100%{transform:translateY(0)}86%{transform:translateY(4px)}}
.cam .rd{animation:blink 1.1s steps(2) infinite}
.cam .gl{animation:glint 4s ease-in-out infinite}
@keyframes glint{50%{opacity:.25}}
#pre .cam{width:230px}

.vf{--af:#ffc83d}.vf.hot{--af:#ff5470}
.vf-num b{position:relative;width:auto;height:auto;border:0;border-radius:0;box-shadow:none;animation:none;font-size:84px;padding:10px 38px;color:#fff;text-shadow:0 0 30px var(--af)}

  background-image:linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af)),linear-gradient(var(--af),var(--af));
  background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%;

const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function confetti(n=140,big=false){
  cv.width=innerWidth;cv.height=innerHeight;
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.6,vx:(Math.random()-.5)*(big?22:14),vy:-Math.random()*(big?24:16)-4,s:5+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6,vr:(Math.random()-.5)*.4,l:140+Math.random()*60});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.r+=p.vr;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/40);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

/* Auto week: Saturday -> Friday. Submission close: Thursday. Saturday e auto reset (notun week). */
function autoWeek(now=new Date()){
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const start=addDays(t,-((t.getDay()+1)%7));
  return {start:iso(start),end:iso(addDays(start,6)),close:iso(addDays(start,5)),theme:""};
}
async function getWeek(){
  const auto=autoWeek(); let cfg=null;
  try{const s=await getDoc(doc(db,"config","week"));if(s.exists())cfg=s.data()}catch(e){}
  const today=iso(new Date());
  if(cfg&&cfg.start&&cfg.end&&today<=cfg.end&&today>=cfg.start)return {...auto,...cfg};
  return auto;
}

/* ---------- compress + upload ---------- */
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=2000,r=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=img.width*r;c.height=img.height*r;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?res(b):rej(),"image/jpeg",.88);URL.revokeObjectURL(u)};
  img.onerror=rej;img.src=u})}
async function upload(blob){
  const f=new FormData();f.append("file",blob);f.append("upload_preset",PRESET);f.append("folder","dcpc");
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:"POST",body:f});
  const j=await r.json();if(!j.secure_url)throw new Error("upload failed");return j.secure_url}

/* interactive winner reveal: 3rd -> 2nd -> 1st */
function reveal(winners){
  const order=[...winners].sort((a,b)=>b.rank-a.rank), medal={1:"🥇",2:"🥈",3:"🥉"}, label={1:"১ম স্থান",2:"২য় স্থান",3:"৩য় স্থান"};
  const box=$("#slots"),btn=$("#rv");let i=0,busy=false;
  box.innerHTML=order.map((x,k)=>`<div class="slot r${x.rank}" data-k="${k}"><div class="in">
    <div class="face front"><div class="q">❓</div>${label[x.rank]||""}</div>
    <div class="face back"><img src="${esc(x.url)}" onclick="event.stopPropagation();window.open(this.src)"><div class="t"><span class="rk">${medal[x.rank]||""}</span><b>${esc(x.name)}</b><span>রোল ${esc(x.roll)} ${x.group?"• "+(GL[x.group]||"")+" "+esc(x.section||""):""}</span>${x.caption?`<br><span>${esc(x.caption)}</span>`:""}</div></div></div></div>`).join("");
  const next=()=>{
    if(busy||i>=order.length)return;busy=true;
    const slot=box.children[i],x=order[i];
    const c=document.createElement("div");c.className="count";slot.style.position="relative";slot.appendChild(c);
    let n=3;c.textContent=bn(n);
    const iv=setInterval(()=>{n--;if(n>0){c.textContent=bn(n);c.style.animation="none";void c.offsetWidth;c.style.animation=""}
      else{clearInterval(iv);c.remove();flash();slot.classList.add("open");
        confetti(x.rank===1?320:120,x.rank===1);
        i++;busy=false;
        btn.textContent=i>=order.length?"🎉 অভিনন্দন সবাইকে!":(order[i].rank===1?"👑 এবার চ্যাম্পিয়ন!":"পরের জন কে?");
        if(i>=order.length)btn.disabled=true}},800);
  };
  btn.onclick=next;
  box.onclick=e=>{const s=e.target.closest(".slot");if(s&&+s.dataset.k===i)next()};
}

/* ---------- ADMIN ---------- */
function login(msg=""){
  app.innerHTML=`<div class="wrap"><div class="card"><h2 style="color:var(--p)">Admin Login</h2>
  <label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
  <button class="full" id="li">Login</button><div class="msg ${msg?"err":""}">${msg}</div></div></div>`;
  $("#li").onclick=async()=>{
    try{
      const credential=await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);
      if(credential.user.email!==ADMIN_EMAIL){
        await signOut(auth);
        login("এই ইমেইলটি Admin account নয়।");
      }
    }catch(e){login("Login failed. Email অথবা password পরীক্ষা করো।")}
  };
}
async function admin(){
  clearInterval(tick);
  const w=await getWeek();let view=w.start,list=[];
  const curMonth=iso(new Date()).slice(0,7);
  app.innerHTML=`<div class="wrap wide">
  <div class="top"><b>DCPC Admin</b><span><button id="seeSite" style="margin-right:6px">সাইট দেখো</button><button id="out">Logout</button></span></div>

  <div class="card"><b>চলমান সপ্তাহ সেট করো</b>
  <div class="three"><div><label>শুরু</label><input type="date" id="s" value="${w.start}"></div>
  <div><label>শেষ</label><input type="date" id="e" value="${w.end}"></div>
  <div><label>জমার শেষ দিন</label><input type="date" id="c" value="${w.close}"></div></div>
  <label>এই সপ্তাহের থিম (ঐচ্ছিক)</label><input id="th" maxlength="60" value="${esc(w.theme||"")}" placeholder="যেমন: বৃষ্টির দিন">
  <button class="full" id="sv">Save</button><div class="msg" id="m"></div></div>

  <div class="card"><b>⚖️ বিচার</b>
  <label>কোন সপ্তাহ (সপ্তাহের শুরুর তারিখ)</label>
  <input type="date" id="vw" value="${view}">
  <div class="row">
    <button id="auto">⚡ স্কোর অনুযায়ী Top 3 বাছাই</button>
    <button id="an" class="gold">📣 ঘোষণা (সাইটে লাইভ)</button>
    <button id="hd" class="del">ঘোষণা সরাও</button>
  </div>
  <div class="row"><button id="fin" style="background:#1f9d55">✅ Finalize: Top 3 রাখো, বাকি মুছে ফেলো + পয়েন্ট যোগ</button></div>
  <div class="msg" id="am"></div></div>
  <div id="list"></div>

  <div class="card" style="margin-top:20px"><b>👑 Photographer of the Month</b>
  <label>মাস</label><input type="month" id="mo" value="${curMonth}">
  <div id="board"></div></div>
  </div>`;
  $("#out").onclick=()=>signOut(auth);
  $("#seeSite").onclick=()=>{location.hash="";};
  const note=(t,ok=true)=>{const m=$("#am");m.className="msg "+(ok?"ok":"err");m.textContent=t};

  $("#sv").onclick=async()=>{
    const S=$("#s").value,E=$("#e").value,C=$("#c").value;
    await setDoc(doc(db,"config","week"),{start:S,end:E,close:C,theme:$("#th").value.trim(),
      startAt:parse(S),endAt:addDays(parse(E),1),closeAt:addDays(parse(C),1)});  // *At fields Firestore rules e deadline check er jonno
    const m=$("#m");m.className="msg ok";m.textContent="Saved ✅"};
  $("#vw").onchange=e=>{view=e.target.value;render()};

  $("#auto").onclick=async()=>{
    const sc=[...list].filter(x=>(x.score||0)>0).sort((a,b)=>b.score-a.score);
    if(!sc.length)return note("আগে ছবিগুলোতে স্কোর দাও",false);
    const top=sc.slice(0,3).map(x=>x.id);
    for(const x of list){const r=top.indexOf(x.id)+1;if((x.rank||0)!==r)await updateDoc(doc(db,"submissions",x.id),{rank:r,winner:r>0})}
    await render();note("Top 3 বাছাই হয়েছে ✅ (দরকার হলে হাতে বদলাও)")};

  $("#an").onclick=async()=>{
    const ws=list.filter(x=>x.rank>0).map(x=>({rank:x.rank,name:x.name,roll:x.roll,group:x.group||"",section:x.section||"",url:x.url,caption:x.caption||""}));
    if(!ws.length)return note("আগে কমপক্ষে একজনকে 🥇/🥈/🥉 দাও",false);
    await setDoc(doc(db,"config","announce"),{weekId:view,winners:ws});
    note("ঘোষণা লাইভ ✅ (শুধু এই সপ্তাহ চলাকালীন দেখাবে, পরের সপ্তাহে নিজে থেকেই মুছে যাবে)")};
  $("#hd").onclick=async()=>{await deleteDoc(doc(db,"config","announce"));note("ঘোষণা সরানো হয়েছে")};

  $("#fin").onclick=async()=>{
    const top=list.filter(x=>x.rank>0);
    if(!top.length)return note("আগে Top 3 বাছাই করো",false);
    if(!confirm(`${top.length} জন রাখা হবে, বাকি ${list.length-top.length}টি ছবি মুছে যাবে। নিশ্চিত?`))return;
    for(const x of top)await setDoc(doc(db,"winners",`${view}_${x.rank}`),{weekId:view,month:view.slice(0,7),rank:x.rank,points:POINTS[x.rank]||0,
      name:x.name,roll:x.roll,group:x.group||"",section:x.section||"",url:x.url,caption:x.caption||"",score:x.score||0});
    for(const x of list)if(!(x.rank>0))await deleteDoc(doc(db,"submissions",x.id));
    await render();await board();note("Finalize হয়েছে ✅ পয়েন্ট যোগ হয়েছে, বাকি ছবি মুছে গেছে")};

  async function render(){
    const s=await getDocs(query(collection(db,"submissions"),where("weekId","==",view)));
    list=s.docs.map(d=>({id:d.id,rank:0,...d.data()})).sort((a,b)=>(b.score??-1)-(a.score??-1));
    const medal=["","🥇","🥈","🥉"];
    $("#list").innerHTML=`<div style="margin:6px 0 12px;font-weight:700">মোট সাবমিশন: ${bn(list.length)}</div><div class="grid">`+list.map(x=>`
    <div class="sub-card ${x.rank?"w":""}"><img src="${esc(x.url)}" onclick="window.open(this.src)">
    <div><b>${esc(x.name)}</b> • রোল ${esc(x.roll)} ${medal[x.rank]||""}<br>${badge(x)}<br><small>${esc(x.caption||"")}</small>
    <div class="scorebox"><input type="number" min="0" max="100" step="0.5" value="${x.score??""}" placeholder="—" data-sc="${x.id}"><span>/ ১০০ নম্বর</span></div>
    <div class="row">${[1,2,3].map(r=>`<button class="${x.rank===r?"gold":""}" data-r="${r}" data-id="${x.id}">${medal[r]}</button>`).join("")}
    <button data-r="0" data-id="${x.id}">✕</button><button class="del" data-d="${x.id}">🗑</button></div></div></div>`).join("")+"</div>";
    document.querySelectorAll("[data-sc]").forEach(i=>i.onchange=async()=>{
      const v=i.value===""?null:Math.max(0,Math.min(100,+i.value));
      await updateDoc(doc(db,"submissions",i.dataset.sc),{score:v});const o=list.find(x=>x.id===i.dataset.sc);if(o)o.score=v});
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{
      const r=+b.dataset.r;
      if(r>0)for(const o of list)if(o.rank===r&&o.id!==b.dataset.id)await updateDoc(doc(db,"submissions",o.id),{rank:0,winner:false});
      await updateDoc(doc(db,"submissions",b.dataset.id),{rank:r,winner:r>0});render()});
    document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete?")){await deleteDoc(doc(db,"submissions",b.dataset.d));render()}});
  }

  async function board(){
    const mo=$("#mo").value;
    const s=await getDocs(query(collection(db,"winners"),where("month","==",mo)));
    const by={};
    s.docs.forEach(d=>{const x=d.data();const k=(x.group||"")+"_"+x.roll;const p=by[k]||(by[k]={roll:x.roll,name:x.name,group:x.group,section:x.section,pts:0,m:{1:0,2:0,3:0},ph:[]});
      p.pts+=x.points||0;p.m[x.rank]=(p.m[x.rank]||0)+1;p.ph.push(x)});
    const a=Object.values(by).sort((x,y)=>y.pts-x.pts||y.m[1]-x.m[1]||y.m[2]-x.m[2]);
    $("#board").innerHTML=a.length?a.map((p,i)=>`<div class="lb ${i===0?"first":""}">
      <div class="rn">${i===0?"👑":bn(i+1)}</div>
      <div><b>${esc(p.name)}</b> • রোল ${esc(p.roll)} ${badge(p)}<br><small>🥇${bn(p.m[1])} 🥈${bn(p.m[2])} 🥉${bn(p.m[3])}</small>
      <div class="ph">${p.ph.sort((x,y)=>x.weekId.localeCompare(y.weekId)).map(x=>`<img src="${esc(x.url)}" title="${fmt(x.weekId)} • ${x.rank} স্থান" onclick="window.open(this.src)">`).join("")}</div></div>
      <div class="pt">${bn(p.pts)}<small>পয়েন্ট</small></div></div>`).join(""):`<div style="margin-top:10px;color:#7a6a92">এই মাসে এখনো কোনো ফলাফল Finalize হয়নি।</div>`;
  }
  $("#mo").onchange=board;
  render();board();
}

/* ---------- ROUTER ---------- */
let user=null,ready=false;
onAuthStateChanged(auth,u=>{
  if(u && u.email!==ADMIN_EMAIL){
    user=null;
    signOut(auth);
  }else{
    user=u;
  }
  ready=true;
  route();
});
function route(){
  if(location.hash==="#/admin"){ if(!ready)return; user?admin():login(); }
  else landing();
}
addEventListener("hashchange",route);
if(location.hash!=="#/admin")landing();
</script>
